services:
  # 1. Reverse Proxy & Web Server (Nginx)
  web:
    image: nginx:1.25-alpine
    container_name: powerout_web
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/html:ro
    depends_on:
      - api
    networks:
      - powerout_network
    restart: unless-stopped

  # 2. Backend REST API (Laravel 13 - PHP 8.4-FPM)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: powerout_api
    volumes:
      - ./api:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-powerout_db}
      - DB_USERNAME=${DB_USERNAME:-powerout_user}
      - DB_PASSWORD=${DB_PASSWORD:-powerout_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - powerout_network
    restart: unless-stopped

  # 3. Frontend SPA (React 18 + Vite)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: powerout_client
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:${APP_PORT:-8080}/api/v1
    networks:
      - powerout_network
    restart: unless-stopped

  # 4. Geospatial Database Engine (PostgreSQL 16 + PostGIS)
  db:
    image: postgis/postgis:16-3.5-alpine
    container_name: powerout_db
    platform: linux/amd64
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-powerout_db}
      POSTGRES_USER: ${DB_USERNAME:-powerout_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-powerout_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-powerout_user} -d ${DB_DATABASE:-powerout_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - powerout_network
    restart: unless-stopped

  # 5. In-Memory Cache, Rate Limiting & Queue Broker (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: powerout_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - powerout_network
    restart: unless-stopped

  # 6. Asynchronous Queue Worker (Laravel Queue Worker)
  queue-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: powerout_queue_worker
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./api:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-powerout_db}
      - DB_USERNAME=${DB_USERNAME:-powerout_user}
      - DB_PASSWORD=${DB_PASSWORD:-powerout_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - powerout_network
    restart: unless-stopped

  # 7. Recurring Task Scheduler (Laravel Scheduler Daemon)
  scheduler:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: powerout_scheduler
    command: php artisan schedule:work
    volumes:
      - ./api:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-powerout_db}
      - DB_USERNAME=${DB_USERNAME:-powerout_user}
      - DB_PASSWORD=${DB_PASSWORD:-powerout_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - powerout_network
    restart: unless-stopped

networks:
  powerout_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
