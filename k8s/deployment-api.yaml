apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-secret # El secreto que ya configuraste
      containers:
        # ----------------------------------------
        # Contenedor 1: PHP-FPM (Laravel)
        # ----------------------------------------
        - name: php-fpm
          image: ghcr.io/ipuhc/powerout-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          # Aquí inyectamos el ConfigMap y el Secret completos
          envFrom:
            - configMapRef:
                name: laravel-env-config
            - secretRef:
                name: laravel-secrets
          
        # ----------------------------------------
        # Contenedor 2: NGINX (Sidecar)
        # ----------------------------------------
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-configmap # El ConfigMap que ya creaste