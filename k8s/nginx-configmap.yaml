apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configmap
  namespace: default
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        
        # El directorio donde reside tu código dentro del contenedor PHP
        root /var/www/html/public; 
        
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        
        index index.php;
        
        charset utf-8;
        
        # 1. Enruta todas las URLs limpias al index.php de Laravel
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
        
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
        
        error_page 404 /index.php;
        
        # 2. Pasa la ejecución de PHP al contenedor PHP-FPM sidecar
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }
        
        # Bloquea el acceso a archivos ocultos por seguridad (ej. .env, .git)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }