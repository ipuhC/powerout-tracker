apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Todo lo que comience con /api se enruta al servicio interno de Laravel
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80

          # Todo lo demás (/) se enruta al servicio interno del Frontend React
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-service
                port:
                  number: 80
